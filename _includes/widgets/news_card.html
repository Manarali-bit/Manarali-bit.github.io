<div class="my-3 bg-white shadow-sm rounded-xl">
    <h6 class="p-3 mb-0 border-bottom border-gray">
        Activities
    </h6>

    <div class="px-3 pb-1 small" style="max-height: 200px; overflow-y: auto;">
        {% for year in site.data.activities %}
        <div class="media py-1 {% unless forloop.first %}border-top border-gray{% endunless %}">

            <div class="mr-3 text-muted my-1">
                {{ year.year }}
            </div>

            <div class="media-body">
                {% for item in year.items %}
                <div class="my-1 d-flex">
                    <div class="mr-2">•</div>
                    <div>{{ item.text }}</div>
                    <div class="ml-auto mt-auto text-muted no-break">
                        <i>{{ item.date }}</i>
                    </div>
                </div>
                {% endfor %}
            </div>

        </div>
        {% endfor %}
    </div>
</div>
