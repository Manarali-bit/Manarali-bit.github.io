short_bio_text_justify: false
short_bio: >-
  <p>
  I am a doctoral researcher in Computational Linguistics at <a href="https://www.uni-bielefeld.de/">
  Bielefeld University </a> and a member of the <a href="https://www.uni-bielefeld.de/sfb/sfb1646/">
  CRC 1646 ‘Linguistic Creativity in Communication’</a>. My doctoral research is supervised by <a href="https://www.techfak.uni-bielefeld.de/~hbuschme/">Hendrik Buschmeier</a>. With a background in cognitive science, I am interested in developing
    cognitively inspired computational models of multimodal reference in interaction.
    My broader research interests include vision and language, reinforcement
    learning, emergent communication, and NeuroAI. I also work on side projects in Arabic NLP.
     <p>

     From November 2026, I will start a research visit with 
      <a href="https://sites.google.com/view/tessa-verhoef/home">Tessa Verhoef</a>
      at
      <a href="https://liacs.leidenuniv.nl/">The Leiden Institute of Advanced Computer Science (LIACS)</a>.
      </p>
   
    <p>
    Before starting my PhD, I worked with
    <a href="https://eliabruni.github.io">Elia Bruni</a>
    at the
    <a href="https://www.uni-osnabrueck.de/fb8/en/ikw/forschen/forschungsgruppen/natural-language-processing">NLP Group</a>,
    where I also completed my Master's thesis, and worked as a research assistant at
    <a href="https://www.dfki.de/en/web">DFKI</a>.

